services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://band:${POSTGRES_PASSWORD}@db:5432/bandapp
      AUDIO_DIR: /data/audio
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
      PORT: 3000
      BODY_SIZE_LIMIT: 200M
      # Pas d'ORIGIN : il figerait url.origin sur un seul domaine. L'app répond sous deux
      # domaines (membres et liens publics), l'origine est lue des en-têtes de Caddy.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      PUBLIC_SHARE_ORIGIN: ${PUBLIC_SHARE_ORIGIN:-}
    volumes:
      - audio_data:/data/audio
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: band
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bandapp
    ports:
      - "127.0.0.1:5432:5432"   # exposé à l'hôte pour pnpm dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U band -d bandapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  audio_data:

networks:
  internal:
